<div class="vstack" style="gap:10px"><h1>How do you want to start?</h1><p class="lead">You can switch between paper and real at any time. They never mix.</p></div>
<div class="vstack" style="gap:12px">
<button class="choice sel"><span class="ic paper"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h8.5L18 7v13.5H6z"/><path d="M14.5 3.5V7H18M9 11h6M9 14.5h6M9 18h3"/></svg></span><span><h3>I’m new: practise on paper</h3><span class="sub">Log made-up trades with the same steps as real ones. Good for learning the terms from your own numbers.</span></span><span class="radio on"></span></button>
<button class="choice"><span class="ic real"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg></span><span><h3>I trade already: import my history</h3><span class="sub">Bring in a file from your broker or exchange, then check the totals against your broker’s.</span></span><span class="radio"></span></button>
<button class="choice"><span class="ic real"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4.5L15.5 5a2.1 2.1 0 0 1 3 3L8 18.5 4 20zM13.5 7l3 3"/></svg></span><span><h3>Log a real trade by hand</h3><span class="sub">Start from today with no file.</span></span><span class="radio"></span></button>
